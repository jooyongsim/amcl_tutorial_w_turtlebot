# AMCL parameters for nav2_amcl.
#
# This is the file you actually *edit* in the "use the packages" track — the
# algorithm itself lives in nav2_amcl. Every parameter below maps onto a concept
# from the lectures (slides/03, 04, 05). Used by launch/localization.launch.py.

amcl:
  ros__parameters:
    use_sim_time: true

    # ---- Frames (slides/06: the TF tree map -> odom -> base_link) ----------
    global_frame_id: "map"
    odom_frame_id: "odom"
    # Set to "base_footprint" for TurtleBot3 (its base frame, confirmed from the
    # robot_state_publisher segments). Use "base_link" for robots that publish
    # odom -> base_link directly. A mismatch here makes AMCL silently fail to
    # transform scans ("could not transform" warning). See ../SIMULATION.md.
    base_frame_id: "base_footprint"
    scan_topic: "scan"

    # ---- Particle count: KLD-sampling bounds (slides/05) -------------------
    # The filter adapts the number of particles between these limits.
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05        # KLD error bound (epsilon)
    pf_z: 0.99          # KLD confidence (1 - delta)

    # ---- When to run an update (saves CPU; slides/03) ---------------------
    # Only run the measurement update after moving this far since the last one.
    update_min_d: 0.25       # meters of translation
    update_min_a: 0.20       # radians of rotation
    resample_interval: 1     # resample every N filter updates

    # ---- Odometry motion model (slides/04) -------------------------------
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # alpha1..alpha4: how much noise each motion component injects. Too small ->
    # overconfident & brittle; too large -> the cloud never converges.
    alpha1: 0.2    # rotation noise from rotation
    alpha2: 0.2    # rotation noise from translation
    alpha3: 0.2    # translation noise from translation
    alpha4: 0.2    # translation noise from rotation
    alpha5: 0.2    # (omni model only) strafe noise

    # ---- Likelihood-field sensor model (slides/04) -----------------------
    laser_model_type: "likelihood_field"   # vs. "beam"
    laser_likelihood_max_dist: 2.0          # max distance for the field lookup
    laser_max_range: 100.0
    laser_min_range: -1.0
    max_beams: 60                           # subsample the scan (speed)
    # Mixture weights of the sensor model components:
    z_hit: 0.5      # correct measurement (Gaussian around obstacle)
    z_rand: 0.5     # random/unexplained measurements
    z_short: 0.05   # unexpected short readings (beam model)
    z_max: 0.05     # max-range readings (beam model)
    sigma_hit: 0.2  # std-dev (m) of the hit Gaussian

    # ---- Augmented MCL recovery (slides/05: kidnapped robot) -------------
    # Inject random particles when the fast likelihood average falls below the
    # slow one. Set both to 0.0 to DISABLE recovery (good for an exercise).
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    # ---- Output -----------------------------------------------------------
    tf_broadcast: true        # publish the map -> odom correction
    transform_tolerance: 1.0
    save_pose_rate: 0.5       # persist last pose to the parameter server
    set_initial_pose: false   # if true, use initial_pose below instead of RViz
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
